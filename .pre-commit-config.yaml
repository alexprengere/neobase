repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: "ef6cf06c079dd6b299dfc720b0f14400c9d168e1"  # frozen: v0.17.5
    hooks:
      - id: "ruff-check"
        args: ["--fix"]

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "a5439e9af2ff9371297bb1a76a01b8ad17989b88"  # frozen: 26.10.1
    hooks:
      - id: "black"

  - repo: "https://github.com/astral-sh/uv-pre-commit"
    rev: "b9d5257d60a86c20fd9a3919d548e08ba5ab905b"  # frozen: 0.13.8
    hooks:
      - id: "uv-audit"
        args: ["--system-certs", "--preview-features", "audit"]

  - repo: "https://github.com/astral-sh/ty-pre-commit"
    rev: "adf4d7a4e31d08d5f724660646c3f10e0084348d"  # frozen: v0.0.101
    hooks:
      - id: "ty"
        args: ["--system-certs", "--group", "test"]

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: "06a39750ec31860bb44f2acf67182c40016cd1e7"  # frozen: v1.32.0
    hooks:
      - id: "zizmor"
        args: ["--pedantic", "--no-progress"]
